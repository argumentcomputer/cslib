name: ix proof

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  prove:
    runs-on: [self-hosted, ix-gpu-prover]
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false # keep .lake build outputs between runs
      - uses: argumentcomputer/ix/.github/actions/catalog-prove@cslib-demo
        with:
          libraries: Cslib
          image: ix-prover:7ef9884d53cdacea
